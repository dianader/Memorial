               <div style="position: absolute; bottom: 12px; right: 18px; font-size: 8px; color: rgba(255, 255, 255, 0.15); letter-spacing: 0.5px; font-weight: 300;">разработчик сайта — Диана Деряпкина</div>
</div>
</div>

<script>
    // Переключение страниц
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
    }

    // Открытие файла в браузере
    function openFile(fileName) {
        console.log('Opening file:', fileName);
        const filePath = 'files/' + fileName;
        window.open(filePath, '_blank');
    }

    // Открытие модального окна контактов
    function openContactModal() {
        document.getElementById('contactModal').classList.add('active');
    }

    // Закрытие модального окна контактов
    function closeContactModal() {
        document.getElementById('contactModal').classList.remove('active');
    }

    // Открытие модального окна писем поддержки
    function openLettersModal() {
        console.log('Opening letters modal');
        const modal = document.getElementById('lettersModal');
        if (modal) {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    }

    // Закрытие модального окна писем
    function closeLettersModal() {
        const modal = document.getElementById('lettersModal');
        if (modal) {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    // Открытие модального окна реквизитов
    function openRequisitesModal() {
        console.log('Opening requisites modal');
        const modal = document.getElementById('requisitesModal');
        if (modal) {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    }

    // Закрытие модального окна реквизитов
    function closeRequisitesModal() {
        const modal = document.getElementById('requisitesModal');
        if (modal) {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    // Открытие модального окна концепции
    function openConceptModal() {
        console.log('🔵 Открытие концепции...');
        const modal = document.getElementById('conceptModal');
        console.log('🔵 Модальное окно:', modal);
        
        if (modal) {
            modal.classList.add('active');
            modal.style.display = 'flex';
            modal.style.position = 'fixed';
            modal.style.zIndex = '999999';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100vw';
            modal.style.height = '100vh';
            document.body.style.overflow = 'hidden';
            console.log('✅ Модальное окно открыто!');
        } else {
            console.error('❌ Модальное окно НЕ НАЙДЕНО!');
        }
    }

    // Закрытие модального окна концепции
    function closeConceptModal() {
        const modal = document.getElementById('conceptModal');
        if (modal) {
            modal.classList.remove('active');
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }
    }

    // Открытие модального окна визуализации
    function openVisualizationModal() {
        const modal = document.getElementById('visualizationModal');
        if (modal) {
            modal.classList.add('active');
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
    }

    // Закрытие модального окна визуализации
    function closeVisualizationModal() {
        const modal = document.getElementById('visualizationModal');
        if (modal) {
            modal.classList.remove('active');
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }
    }

    // Закрытие модальных окон при клике вне их
    window.onclick = function(event) {
        const lettersModal = document.getElementById('lettersModal');
        const requisitesModal = document.getElementById('requisitesModal');
        const contactModal = document.getElementById('contactModal');
        const conceptModal = document.getElementById('conceptModal');
        const visualizationModal = document.getElementById('visualizationModal');
        
        if (event.target == lettersModal) {
            closeLettersModal();
        }
        if (event.target == requisitesModal) {
            closeRequisitesModal();
        }
        if (event.target == contactModal) {
            closeContactModal();
        }
        if (event.target == conceptModal) {
            closeConceptModal();
        }
        if (event.target == visualizationModal) {
            closeVisualizationModal();
        }
    }

    // Принудительное исправление 4 страницы на мобильных
    document.addEventListener('DOMContentLoaded', function() {
        if (window.innerWidth <= 768) {
            var page4 = document.getElementById('page4');
            if (page4) {
                var side = page4.querySelector('.docs-side');
                var main = page4.querySelector('.docs-main');
                var grid = page4.querySelector('.docs-grid');
                
                if (main) {
                    main.style.display = 'block';
                    main.style.flexDirection = 'column';
                    main.style.width = '100%';
                }
                
                if (grid) {
                    grid.style.display = 'flex';
                    grid.style.flexDirection = 'column';
                    grid.style.gap = '8px';
                    grid.style.marginBottom = '15px';
                }
                
                if (side) {
                    side.style.position = 'static';
                    side.style.top = 'auto';
                    side.style.right = 'auto';
                    side.style.left = 'auto';
                    side.style.width = '100%';
                    side.style.marginTop = '15px';
                    side.style.clear = 'both';
                    side.style.display = 'block';
                }
                
                var cards = page4.querySelectorAll('.doc-card');
                cards.forEach(function(card) {
                    card.style.width = '100%';
                    card.style.height = '85px';
                    card.style.marginBottom = '8px';
                });
                
                var sidePart = page4.querySelector('.side-part');
                if (sidePart) {
                    sidePart.style.width = '100%';
                    sidePart.style.padding = '15px';
                }
                
                var btns = page4.querySelectorAll('.side-btn, .contact-btn');
                btns.forEach(function(btn) {
                    btn.style.width = '100%';
                    btn.style.display = 'block';
                    btn.style.marginTop = '10px';
                });
            }
        }
    });
</script>

</body>
</html>
